name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, pdo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Clone NENE2 (local path dependency)
        run: git clone --depth=1 https://github.com/hideyukiMORI/NENE2.git ../NENE2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Locale parity (six locales, ADR 0011)
        run: composer locales:check

      - name: Coding standards (PSR-12)
        run: composer cs

      - name: Static analysis (PHPStan level 8)
        run: composer stan

      - name: Tests (PHPUnit)
        run: composer test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Contract codegen is up to date
        run: |
          npm run codegen
          git diff --exit-code src/shared/api/schema.gen.ts

      - name: Check (type-check, lint, format, test, knip, storybook)
        run: npm run check
