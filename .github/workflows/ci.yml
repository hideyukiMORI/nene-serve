name: CI

on:
  push:
    branches: [main]
  pull_request:

  # Weekly schedule: re-runs this same CI (incl. the dependency audits — `npm`
  # in the `frontend` job and `composer` in the `backend` job) on a cadence so
  # newly-published advisories against pinned versions are caught even without
  # a new push. Cron minute is offset from
  # other fleet repos to avoid a same-minute stampede (00=origin/fleet-tooling,
  # 05=clear, 10=deal, 15=field, 20=payout, 25=records, 30=nene2-python,
  # 35=vault, 40=records-commercial, 45=concierge, 50=contact, 55=invoice,
  # 1時台 05=profile, 10=serve).
  #
  # KNOWN LIMITATION: GitHub auto-disables scheduled workflows after 60 days
  # of repository inactivity. A dormant repo — the one most in need of this
  # check — is exactly the one where it silently stops firing. There is no
  # in-repo fix for this; it needs an external poller (fleet-level, tracked
  # outside this repo) to detect a stale last-run date.
  schedule:
    - cron: '10 1 * * 1' # Monday 01:10 UTC = 10:10 JST

  # Manual trigger, with an optional switch to rehearse the failure path
  # (see the "Simulate failure" step in the `frontend` job and the
  # `notify-failure` job below) without waiting for the next scheduled run.
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Intentionally fail the frontend job to verify the failure-notification path'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # github.event_name is included so a schedule/workflow_dispatch run is not
  # cancelled by a push run racing it on the same ref (observed in the fleet
  # rollout: without it, dispatch/schedule runs get silently cancelled by push).
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Real MySQL for the integration suite (native prepared statements, as in
      # prod) — catches dialect-specific bugs SQLite cannot (e.g. #116).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nene_serve_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # Real PostgreSQL for the same integration suite — the other prod target
      # (issue #120). The schema is the MySQL migrations translated to PG DDL.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nene_serve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, pdo, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Clone NENE2 (local path dependency)
        run: git clone --depth=1 https://github.com/hideyukiMORI/NENE2.git ../NENE2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Dependency-vulnerability gate. Kept as its own step rather than folded into
      # `composer check`, so the job log (and any cross-repo tooling that reads it)
      # can tell whether the audit ran at all. A check that leaves no trace cannot be
      # distinguished from a check that is missing.
      - name: composer audit
        run: composer audit --no-interaction

      - name: Locale parity (six locales, ADR 0011)
        run: composer locales:check

      - name: Coding standards (PSR-12)
        run: composer cs

      - name: Static analysis (PHPStan level 8)
        run: composer stan

      - name: NENE2 conformance linter
        run: composer conformance

      - name: Tests (PHPUnit)
        run: composer test

      - name: Apply migrations (integration MySQL)
        run: |
          for f in database/migrations/*.sql; do
            mysql -h127.0.0.1 -P3306 -uroot -proot nene_serve_test < "$f"
          done

      - name: Apply schema (integration PostgreSQL)
        env:
          PGPASSWORD: postgres
        run: php scripts/mysql-to-pgsql.php | psql -h 127.0.0.1 -p 5432 -U postgres -d nene_serve_test -v ON_ERROR_STOP=1

      - name: Integration tests (MySQL + PostgreSQL)
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: '3306'
          MYSQL_TEST_DB: nene_serve_test
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: root
          PGSQL_TEST_HOST: 127.0.0.1
          PGSQL_TEST_PORT: '5432'
          PGSQL_TEST_DB: nene_serve_test
          PGSQL_TEST_USER: postgres
          PGSQL_TEST_PASSWORD: postgres
        run: composer test:integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Placed after Checkout (not literally the first step): this job's
      # `defaults.run.working-directory: frontend` doesn't exist until checkout
      # runs, so a step placed before it would fail on a missing directory
      # instead of the intended `exit 1` (hit during the fleet rollout of this
      # harness — nene-deal #207). Still fails before any real work.
      - name: Simulate failure (validation only)
        if: inputs.simulate_failure
        run: exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Contract codegen is up to date
        run: |
          npm run codegen
          git diff --exit-code src/shared/api/schema.gen.ts

      - name: Check (type-check, lint, format, test, knip, storybook)
        run: npm run check

      # audit-ci = npm audit + a per-advisory allowlist, so a not-yet-fixable advisory can be
      # excepted with a written, expiring reason instead of blunting the whole gate. Anything
      # high/critical that is not listed in frontend/audit-ci.jsonc still fails.
      # Policy: docs/development/dependency-audit.md
      - name: Audit (fail on high/critical)
        run: npm run audit

  notify-failure:
    name: Open an issue when the scheduled run fails
    if: failure() && (github.event_name == 'schedule' || inputs.simulate_failure)
    needs: [build, frontend]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      ISSUE_TITLE: '🔴 serve: 週次 CI（schedule）が失敗しています'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or update the failure issue
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          body="週次の schedule 実行が失敗しました。 実行: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
