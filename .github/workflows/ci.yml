name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, pdo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Locale parity (six locales, ADR 0011)
        run: composer locales:check

      - name: Coding standards (PSR-12)
        run: composer cs

      - name: Static analysis (PHPStan level 8)
        run: composer stan

      - name: Tests (PHPUnit)
        run: composer test
