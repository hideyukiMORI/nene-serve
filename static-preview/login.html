<!doctype html>
<html lang="en" data-theme="light" data-design="calm">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeNe Serve — Login (static preview)</title>
<link rel="stylesheet" href="assets/app.css"></head>
<body><div class="fs-wrap">
  <div class="fs-lang"><span class="hdr-controls"><span class="mode-toggle"><button class="active" type="button">☀</button><button type="button">☾</button></span><span class="lang-toggle"><button class="active" type="button">EN</button><button type="button">日本語</button></span></span></div>
  <div class="auth" style="min-height:100vh">
    <aside class="auth-brand"><div class="grid-deco"></div>
      <div class="row g3"><span class="brand-logo"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg></span></span><span class="semi" style="font-size:16px">NeNe Serve</span></div>
      <div class="stack g4" style="max-width:32ch"><h2 class="t-display">NeNe Serve</h2><p class="muted t-body">Ad serving &amp; analytics</p></div>
      <span class="faint t-tiny">© 2026 NeNe Serve</span>
    </aside>
    <div class="auth-form"><form class="auth-card stack g6">
      <div class="stack g2"><h1 class="t-h1">Sign in</h1><span class="muted t-cap">Operator console</span></div>
      <div class="field"><label>Organization</label><input class="input" type="text" placeholder="acme" value="acme"></div>
      <div class="field"><label>Email</label><input class="input" type="email" placeholder="admin@acme.test" value="admin@acme.test"></div>
      <div class="field"><label>Password</label><input class="input" type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-block">Sign in</button>
      <div class="row g2 faint t-tiny" style="justify-content:center"><span>Encrypted, audited access.</span></div>
    </form></div>
  </div>
</div></body></html>
