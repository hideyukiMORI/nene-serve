# NeNe Serve — local dev stack (scaffold, #10)
# Ports (CLAUDE.md): API 8010 · phpMyAdmin 8011 · MySQL 3380 · Mailpit UI 8013
services:
  api:
    build: .
    ports:
      - "8010:8010"
    volumes:
      - .:/app
    working_dir: /app
    command: php -S 0.0.0.0:8010 -t public_html public_html/index.php
    environment:
      APP_ENV: ${APP_ENV:-local}
      NENE_SERVE_JWT_SECRET: ${NENE_SERVE_JWT_SECRET:-dev-insecure-secret-change-me}
      # Opt-in to the injected dev secret when NENE_SERVE_JWT_SECRET is unset
      # (GuardedJwtSecretResolver, #138). Pass-through, empty by default so
      # production stays fail-closed; ignored in production regardless.
      NENE2_ALLOW_DEV_SECRET: ${NENE2_ALLOW_DEV_SECRET:-}
      # Base64 of 32 bytes — encrypts at-rest secrets (e.g. the SMTP password).
      # Dev default only; production sets a real key out of band.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-bmVuZS1zZXJ2ZS1kZXYtaW5zZWN1cmUta2V5LTMyYnk=}
      DB_HOST: db
      DB_PORT: "3306"
      # NENE2 ConfigLoader reads DB_NAME / DB_USER; DB_DATABASE / DB_USERNAME are
      # kept for the docker-compose ${...} interpolation the db service uses.
      DB_NAME: ${DB_DATABASE:-nene_serve}
      DB_USER: ${DB_USERNAME:-nene}
      DB_DATABASE: ${DB_DATABASE:-nene_serve}
      DB_USERNAME: ${DB_USERNAME:-nene}
      DB_PASSWORD: ${DB_PASSWORD:-nene}
      # HTML5 bundle malware scan (clamd). Unset → StubBundleScanner.
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: "3310"
    depends_on:
      - db
      - mailpit

  # Dev mail catcher: SMTP on 1025, web UI on 8013.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8013:8025"
      - "1080:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # HTML5 bundle malware scanner (clamd on 3310). First start loads the virus DB
  # and can take a few minutes before it accepts scans.
  clamav:
    image: clamav/clamav:latest
    ports:
      - "3308:3310"

  db:
    image: mysql:8.4
    ports:
      - "3380:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nene_serve}
      MYSQL_USER: ${DB_USERNAME:-nene}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nene}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8011:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
    depends_on:
      - db

volumes:
  dbdata:
