# NeNe Serve — local dev stack (scaffold, #10)
# Ports (CLAUDE.md): API 8910 · phpMyAdmin 8911 · MySQL 3392 · Mailpit UI 8913
services:
  api:
    build: .
    ports:
      - "8910:8910"
    volumes:
      - .:/app
    working_dir: /app
    command: php -S 0.0.0.0:8910 -t public_html public_html/index.php
    environment:
      APP_ENV: ${APP_ENV:-local}
      NENE_SERVE_JWT_SECRET: ${NENE_SERVE_JWT_SECRET:-dev-insecure-secret-change-me}
      # Base64 of 32 bytes — encrypts at-rest secrets (e.g. the SMTP password).
      # Dev default only; production sets a real key out of band.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-bmVuZS1zZXJ2ZS1kZXYtaW5zZWN1cmUta2V5LTMyYnk=}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-nene_serve}
      DB_USERNAME: ${DB_USERNAME:-nene}
      DB_PASSWORD: ${DB_PASSWORD:-nene}
    depends_on:
      - db
      - mailpit

  # Dev mail catcher: SMTP on 1025, web UI on 8913.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8913:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  db:
    image: mysql:8.4
    ports:
      - "3392:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nene_serve}
      MYSQL_USER: ${DB_USERNAME:-nene}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nene}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8911:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
    depends_on:
      - db

volumes:
  dbdata:
